<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DebtOS">
<title>DebtOS</title>
<link rel="manifest" href="manifest.json">
<base href="/MinimalDebtOS/">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen" role="dialog" aria-modal="true" aria-label="Passcode lock screen">
  <div class="lock-logo" aria-hidden="true">DebtOS</div>
  <div class="lock-dots" aria-label="Passcode entry indicator" role="status" id="lockDots">
    <!-- dots are rendered dynamically by app.js based on PIN length -->
  </div>
  <div class="lock-pad" role="group" aria-label="Number pad">
    <button class="lock-key" onclick="lkPress('1')" aria-label="1">1</button>
    <button class="lock-key" onclick="lkPress('2')" aria-label="2">2</button>
    <button class="lock-key" onclick="lkPress('3')" aria-label="3">3</button>
    <button class="lock-key" onclick="lkPress('4')" aria-label="4">4</button>
    <button class="lock-key" onclick="lkPress('5')" aria-label="5">5</button>
    <button class="lock-key" onclick="lkPress('6')" aria-label="6">6</button>
    <button class="lock-key" onclick="lkPress('7')" aria-label="7">7</button>
    <button class="lock-key" onclick="lkPress('8')" aria-label="8">8</button>
    <button class="lock-key" onclick="lkPress('9')" aria-label="9">9</button>
    <div class="lock-key empty" aria-hidden="true"></div>
    <button class="lock-key" onclick="lkPress('0')" aria-label="0">0</button>
    <button class="lock-key del" onclick="lkDel()" aria-label="Delete">⌫</button>
  </div>
  <div class="lock-hint" role="status">Enter passcode to continue</div>
</div>

<!-- TOP BAR -->
<div class="topbar" role="banner">
  <div class="topbar-inner">
    <span class="topbar-title" id="topTitle">Overview</span>
    <div class="topbar-right">
      <div style="text-align:right">
        <span class="topbar-date mono" id="topDate"></span>
        <div id="lastUpdated" style="font-size:.55rem;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-top:2px"></div>
      </div>
      <button class="gear-btn" id="gearBtn" onclick="openSettings()" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65[...]
        <span class="gear-icon" aria-hidden="true">⚙️</span>
      </button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" role="main">

  <!-- PAGE 0: DASHBOARD -->
  <div class="page active" id="p0" role="region" aria-label="Overview">
  <div class="page-inner">

    <!-- Hero: Total Debt -->
    <div class="hero">
      <div class="hero-label">Total debt</div>
      <div class="hero-row">
        <div class="hero-num mono hidden-val" id="dTotal" aria-live="polite">฿0</div>
        <button class="reveal-btn" id="revealBtn" onclick="toggleReveal()" aria-label="Toggle balance visibility">Show</button>
      </div>
      <div class="pills">
        <div class="pill"><b id="dCount">0</b> accounts</div>
        <div class="pill">avg <b id="dAvgRate">0%</b>/yr</div>
        <div class="pill">paid <b id="dPaid">฿0</b></div>
      </div>
    </div>

    <!-- Interest boxes 2x2 grid -->
    <div class="section-label" style="margin-bottom:10px;padding:0 2px">Interest cost</div>
    <div class="int-grid">
      <div class="int-box highlight">
        <div class="int-box-label">Per year</div>
        <div class="int-box-val mono" id="dYear" aria-live="polite">฿0</div>
        <div class="int-box-sub">annually</div>
      </div>
      <div class="int-box">
        <div class="int-box-label">Per month</div>
        <div class="int-box-val mono" id="dMonth" aria-live="polite">฿0</div>
        <div class="int-box-sub">every month</div>
      </div>
      <div class="int-box">
        <div class="int-box-label">Per day</div>
        <div class="int-box-val mono" id="dDay" aria-live="polite">฿0</div>
        <div class="int-box-sub">daily burn</div>
      </div>
      <div class="int-box">
        <div class="int-box-label">Per hour</div>
        <div class="int-box-val mono" id="dHour" aria-live="polite">฿0</div>
        <div class="int-box-sub">every hour</div>
      </div>
    </div>

    <!-- Live ticker -->
    <div class="ticker-box" aria-label="Live interest accrual">
      <div class="ticker-left">
        <div class="ticker-head">
          <div class="live-dot" aria-hidden="true"></div>
          Accrued this session
        </div>
        <div class="ticker-num mono" id="dTicker" aria-live="off">฿0.0000</div>
        <div class="ticker-foot" id="dTickerSub">฿0 / sec</div>
      </div>
      <div class="ticker-sec-badge">
        <div class="ticker-sec-label">/ sec</div>
        <div class="ticker-sec-val mono" id="dPerSec">฿0.000000</div>
      </div>
    </div>

    <!-- Breakdown by account -->
    <div class="section">
      <div class="section-label">By account</div>
      <div class="section-group" id="dBreakdown" role="list"></div>
    </div>

  </div>
  </div>

  <!-- PAGE 1: DEBTS -->
  <div class="page" id="p1" role="region" aria-label="Debts">
  <div class="page-inner">
    <div class="list-head">
      <div class="list-head-label">Debts</div>
      <button class="add-btn" onclick="openSheet(null)" aria-label="Add new debt">+</button>
    </div>
    <div class="debt-list-wrap">
      <div id="debtList" role="list"></div>
    </div>
    <div class="total-row">
      <span class="total-row-label">Total outstanding</span>
      <span class="total-row-val mono" id="listTotal" aria-live="polite">฿0</span>
    </div>
  </div>
  </div>

</div><!-- /#app -->

<!-- BOTTOM NAV -->
<nav role="navigation" aria-label="Main navigation">
  <button class="nb on" id="nb0" onclick="goPage(0)" aria-label="Overview" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"[...]
    <span class="nb-label">Overview</span>
  </button>
  <button class="nb" id="nb1" onclick="goPage(1)" aria-label="Debts">
    <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1.2"/><c[...]
    <span class="nb-label">Debts</span>
  </button>
</nav>

<!-- BOTTOM SHEET OVERLAY -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Debt editor">
  <div class="sheet" id="sheet"></div>
</div>

<!-- TOAST NOTIFICATION -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- HIDDEN IMPORT INPUT -->
<input type="file" id="importFile" accept="application/json,.json" style="display:none">

<script src="app.js" defer></script>
</body>
</html>
