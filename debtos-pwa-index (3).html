<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f0f0ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DebtOS">
<title>DebtOS</title>
<link rel="manifest" href="manifest.json">
<base href="/MinimalDebtOS/">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f0ed;--s1:#ffffff;--s2:#f7f7f5;--s3:#eeeeeb;
  --line:#e4e4e0;--dim:#b0b0aa;--sub:#888884;--muted:#666662;--text:#1a1a18;
  --red:#d93545;--grn:#12a860;--yel:#b58a00;--blue:#2a6dd9;
  --red-dim:rgba(217,53,69,.08);--grn-dim:rgba(18,168,96,.08);
  --shadow:0 2px 8px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,.09),0 16px 40px rgba(0,0,0,.08);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --r:16px;--r-sm:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{color:var(--text);font-family:'Inter',sans-serif;display:flex;flex-direction:column}
.mono{font-family:'JetBrains Mono',monospace}

/* LAYOUT */
#app{flex:1;overflow:hidden;position:relative}
.page{
  position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-t)+72px) 0 calc(var(--safe-b)+88px);
  opacity:0;pointer-events:none;transform:translateX(24px);
  transition:opacity .22s ease,transform .22s ease;
}
.page.active{opacity:1;pointer-events:all;transform:none}
.page.left{transform:translateX(-24px)}
.page-inner{
  max-width:540px;margin:0 auto;padding:0 16px;
}

/* TOP BAR */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  padding:calc(var(--safe-t)+14px) 0 14px;
  background:rgba(240,240,237,.92);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.topbar-inner{
  max-width:540px;margin:0 auto;padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.topbar-title{font-size:.72rem;font-weight:600;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.topbar-date{font-size:.64rem;color:var(--dim);font-family:'JetBrains Mono',monospace}

/* NAV */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  padding:8px 0 calc(var(--safe-b)+8px);
  background:rgba(240,240,237,.92);border-top:1px solid var(--line);
  display:flex;justify-content:center;gap:72px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.nb{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:none;cursor:pointer;
  color:var(--dim);transition:color .15s;padding:4px 20px;
}
.nb.on{color:var(--text)}
.nb svg{width:20px;height:20px;stroke-width:1.6;fill:none;stroke:currentColor}
.nb-label{font-size:.56rem;letter-spacing:.1em;font-weight:600;text-transform:uppercase}

/* HERO */
.hero{
  background:var(--s1);border:1px solid var(--line);
  border-radius:var(--r);padding:24px;margin-bottom:16px;
  box-shadow:var(--shadow-lg);
}
.hero-label{font-size:.6rem;color:var(--sub);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.hero-num{
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(2.4rem,9vw,4rem);font-weight:400;
  color:var(--text);line-height:1;letter-spacing:-.02em;
}
.hero-num.flash{animation:flash .3s ease}
@keyframes flash{0%{opacity:.15}100%{opacity:1}}
.pills{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.pill{
  font-size:.65rem;color:var(--sub);
  background:var(--s2);border:1px solid var(--line);
  border-radius:99px;padding:4px 11px;
}
.pill b{color:var(--text);font-weight:600}

/* INTEREST BOXES */
.int-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.int-box{
  background:var(--s1);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;display:flex;flex-direction:column;gap:4px;
  box-shadow:var(--shadow);transition:box-shadow .15s;
}
.int-box.highlight{border-color:rgba(217,53,69,.25);background:#fff8f8;box-shadow:0 2px 8px rgba(217,53,69,.08),0 8px 24px rgba(217,53,69,.07)}
.int-box-label{font-size:.56rem;color:var(--sub);letter-spacing:.12em;text-transform:uppercase}
.int-box-val{
  font-family:'JetBrains Mono',monospace;
  font-size:1.05rem;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.int-box.highlight .int-box-val{color:var(--red)}
.int-box-sub{font-size:.58rem;color:var(--dim)}

/* TICKER */
.ticker-box{
  background:var(--s1);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin-bottom:16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:var(--shadow);
}
.ticker-left{}
.ticker-head{font-size:.56rem;color:var(--sub);display:flex;align-items:center;gap:6px;margin-bottom:6px;letter-spacing:.1em;text-transform:uppercase}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--grn);animation:blink 1.4s ease-in-out infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.ticker-num{font-family:'JetBrains Mono',monospace;font-size:1.6rem;color:var(--yel)}
.ticker-foot{font-size:.6rem;color:var(--dim);margin-top:3px}
.ticker-sec-badge{
  background:var(--s2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 12px;text-align:center;flex-shrink:0;
}
.ticker-sec-label{font-size:.54rem;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.ticker-sec-val{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted)}

/* SECTION */
.section{margin-bottom:16px}
.section-label{font-size:.58rem;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;padding:0 2px}
.row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;border-bottom:1px solid var(--line);
  background:var(--s1);
}
.row:first-of-type{border-radius:var(--r) var(--r) 0 0}
.row:last-of-type{border-bottom:none;border-radius:0 0 var(--r) var(--r)}
.row:first-of-type:last-of-type{border-radius:var(--r)}
.section-group{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row-name{font-size:.84rem;color:var(--sub)}
.row-val{font-family:'JetBrains Mono',monospace;font-size:.9rem}

/* DEBT LIST */
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.list-head-label{font-size:.6rem;color:var(--sub);letter-spacing:.14em;text-transform:uppercase}
.add-btn{
  width:32px;height:32px;border-radius:99px;
  border:1px solid var(--line);background:var(--s1);
  color:var(--text);font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
  box-shadow:var(--shadow);
}
.add-btn:active{background:var(--s3);transform:scale(.88)}

.debt-list-wrap{
  background:var(--s1);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin-bottom:16px;
  box-shadow:var(--shadow);
}
.debt-item{
  display:flex;align-items:center;gap:14px;padding:15px 16px;
  border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;
}
.debt-item:last-child{border-bottom:none}
.debt-item:active{background:var(--s2)}
.d-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.d-main{flex:1;min-width:0}
.d-name{font-size:.88rem;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-sub{font-size:.66rem;color:var(--sub)}
.d-right{text-align:right;flex-shrink:0}
.d-amount{font-family:'JetBrains Mono',monospace;font-size:.9rem}
.d-int{font-size:.63rem;color:var(--sub);margin-top:2px}

.total-row{
  background:var(--s1);border:1px solid var(--line);border-radius:var(--r);
  display:flex;justify-content:space-between;align-items:center;
  padding:16px;box-shadow:var(--shadow);
}
.total-row-label{font-size:.76rem;color:var(--sub);font-weight:500}
.total-row-val{font-family:'JetBrains Mono',monospace;font-size:.95rem}

/* SHEET */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:100;display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.overlay.on{display:flex}
.sheet{
  background:var(--s1);border-top:1px solid var(--line);
  border-radius:22px 22px 0 0;
  padding:16px 20px calc(var(--safe-b)+20px);
  width:100%;max-width:500px;max-height:90vh;overflow-y:auto;
  animation:up .22s ease;
  box-shadow:0 -8px 40px rgba(0,0,0,.14);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sh-handle{width:36px;height:3px;background:var(--line);border-radius:99px;margin:0 auto 20px}
.sh-title{font-size:.95rem;font-weight:600;margin-bottom:18px}
.field{margin-bottom:13px}
.field label{display:block;font-size:.58rem;color:var(--sub);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;padding-left:1px}
.field input{
  width:100%;background:var(--s2);border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--text);font-family:'Inter',sans-serif;font-size:.88rem;
  padding:11px 13px;outline:none;transition:border-color .15s;
}
.field input:focus{border-color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.divider{border:none;border-top:1px solid var(--line);margin:16px 0}
.sh-actions{display:flex;gap:8px;margin-top:18px}
.btn-p{flex:1;padding:12px;border-radius:var(--r-sm);border:none;background:var(--text);color:var(--s1);font-family:'Inter',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-p:active{opacity:.7}
.btn-g{padding:12px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:transparent;color:var(--sub);font-family:'Inter',sans-serif;font-size:.85rem;cursor:pointer}
.btn-g:active{background:var(--s2)}
.btn-d{padding:12px 16px;border-radius:var(--r-sm);border:none;background:var(--red-dim);color:var(--red);font-family:'Inter',sans-serif;font-size:.85rem;cursor:pointer;transition:background .15s}
.btn-d:active{background:rgba(217,53,69,.15)}

.pay-row{display:flex;gap:8px;margin-top:10px}
.pay-input{flex:1;background:var(--s2);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.88rem;padding:10px 13px;outline:none}
.pay-input:focus{border-color:var(--grn)}
.pay-btn{padding:10px 16px;border-radius:var(--r-sm);border:1px solid rgba(18,168,96,.3);background:var(--grn-dim);color:var(--grn);font-family:'Inter',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;flex-shrink:0;transition:background .15s}
.pay-btn:active{background:rgba(18,168,96,.15)}

/* TOAST */
.toast{
  position:fixed;bottom:calc(var(--safe-b)+84px);left:50%;
  transform:translateX(-50%) translateY(8px);z-index:200;
  background:var(--text);border:none;color:var(--s1);
  padding:9px 18px;border-radius:99px;font-size:.74rem;font-weight:500;
  opacity:0;transition:all .22s;pointer-events:none;white-space:nowrap;
  letter-spacing:.02em;box-shadow:0 4px 16px rgba(0,0,0,.18);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

::-webkit-scrollbar{width:2px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line);border-radius:1px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="topbar-title" id="topTitle">Overview</span>
    <span class="topbar-date mono" id="topDate"></span>
  </div>
</div>

<div id="app">

  <!-- PAGE 0: DASHBOARD -->
  <div class="page active" id="p0">
  <div class="page-inner">

    <!-- Hero: Total Debt -->
    <div class="hero">
      <div class="hero-label">Total debt</div>
      <div class="hero-num mono" id="dTotal">฿0</div>
      <div class="pills">
        <div class="pill"><b id="dCount">0</b> accounts</div>
        <div class="pill">avg <b id="dAvgRate">0%</b>/yr</div>
        <div class="pill">paid <b id="dPaid">฿0</b></div>
      </div>
    </div>

    <!-- Interest boxes 2x2 grid -->
    <div class="section-label" style="margin-bottom:10px;padding:0 2px">Interest cost</div>
    <div class="int-grid">
      <div class="int-box highlight">
        <div class="int-box-label">Per year</div>
        <div class="int-box-val mono" id="dYear">฿0</div>
        <div class="int-box-sub">annually</div>
      </div>
      <div class="int-box">
        <div class="int-box-label">Per month</div>
        <div class="int-box-val mono" id="dMonth">฿0</div>
        <div class="int-box-sub">every month</div>
      </div>
      <div class="int-box">
        <div class="int-box-label">Per day</div>
        <div class="int-box-val mono" id="dDay">฿0</div>
        <div class="int-box-sub">daily burn</div>
      </div>
      <div class="int-box">
        <div class="int-box-label">Per hour</div>
        <div class="int-box-val mono" id="dHour">฿0</div>
        <div class="int-box-sub">every hour</div>
      </div>
    </div>

    <!-- Live ticker -->
    <div class="ticker-box">
      <div class="ticker-left">
        <div class="ticker-head">
          <div class="live-dot"></div>
          Accrued this session
        </div>
        <div class="ticker-num mono" id="dTicker">฿0.0000</div>
        <div class="ticker-foot" id="dTickerSub">฿0 / sec</div>
      </div>
      <div class="ticker-sec-badge">
        <div class="ticker-sec-label">/ sec</div>
        <div class="ticker-sec-val mono" id="dPerSec">฿0.000000</div>
      </div>
    </div>

    <!-- Breakdown by account -->
    <div class="section">
      <div class="section-label">By account</div>
      <div class="section-group" id="dBreakdown"></div>
    </div>

  </div><!-- /page-inner -->
  </div>

  <!-- PAGE 1: DEBTS -->
  <div class="page" id="p1">
  <div class="page-inner">
    <div class="list-head">
      <div class="list-head-label">Debts</div>
      <button class="add-btn" onclick="openSheet(null)">+</button>
    </div>
    <div class="debt-list-wrap">
      <div id="debtList"></div>
    </div>
    <div class="total-row">
      <span class="total-row-label">Total outstanding</span>
      <span class="total-row-val mono" id="listTotal">฿0</span>
    </div>
  </div><!-- /page-inner -->
  </div>

</div>

<!-- BOTTOM NAV -->
<nav>
  <button class="nb on" id="nb0" onclick="goPage(0)">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span class="nb-label">Overview</span>
  </button>
  <button class="nb" id="nb1" onclick="goPage(1)">
    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1.2"/><circle cx="3.5" cy="12" r="1.2"/><circle cx="3.5" cy="18" r="1.2"/></svg>
    <span class="nb-label">Debts</span>
  </button>
</nav>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SK = 'debtos_v7';
const INIT_DEBTS = [
  {id:1,name:'Finnix',        rate:0.33, cutoff:'',   due:'20', full:15768, debt:13600, note:''},
  {id:2,name:'Rabbit Cash',   rate:0.33, cutoff:'30', due:'15', full:25300, debt:25500, note:''},
  {id:3,name:'Promise',       rate:0.25, cutoff:'',   due:'31', full:10000, debt:9700,  note:''},
  {id:4,name:'KTC Proud',     rate:0.25, cutoff:'20', due:'5',  full:34500, debt:35222, note:''},
  {id:5,name:'Umay',          rate:0.198,cutoff:'',   due:'2',  full:72000, debt:72848, note:''},
  {id:6,name:'UOB Credit',    rate:0.16, cutoff:'20', due:'13', full:96000, debt:83068, note:''},
  {id:7,name:'Samsung Finance',rate:0,   cutoff:'',   due:'1',  full:16228, debt:4056,  note:''},
  {id:8,name:'Shopee',        rate:0,    cutoff:'',   due:'',   full:0,     debt:1030,  note:''},
  {id:9,name:'Thunder',       rate:0.33, cutoff:'',   due:'',   full:40000, debt:38500, note:''},
];

function load(){
  try{ const s=localStorage.getItem(SK); if(s)return JSON.parse(s); }catch(e){}
  return { debts:JSON.parse(JSON.stringify(INIT_DEBTS)), nextId:10, totalPaid:0 };
}
function save(){ try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){} }
let S = load();

const fmt   = (n,d=0)=>(n||0).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtB  = (n,d=0)=>'฿'+fmt(n,d);
const totDebt = ()=>S.debts.reduce((a,d)=>a+d.debt,0);
const intYear = ()=>S.debts.reduce((a,d)=>a+d.debt*(d.rate||0),0);
const dotCol  = r=>!r?'var(--dim)':r>=0.3?'var(--red)':r>=0.2?'var(--yel)':'var(--grn)';

// NAV
const TITLES = ['Overview','Debts'];
let cur = 0;
function goPage(i){
  document.querySelectorAll('.page').forEach((p,j)=>{
    p.classList.toggle('active',j===i);
    p.classList.toggle('left',j<i);
  });
  document.querySelectorAll('.nb').forEach((b,j)=>b.classList.toggle('on',j===i));
  document.getElementById('topTitle').textContent = TITLES[i];
  cur = i;
  if(i===1) renderList();
}

// DASHBOARD
let _raf, _t0 = Date.now();

function renderDash(flash){
  const td  = totDebt();
  const iy  = intYear();
  const im  = iy/12, id2=iy/365, ih=iy/8760, is_=iy/(365*24*3600);
  const wr  = S.debts.filter(d=>d.rate>0);
  const avg = wr.length ? wr.reduce((a,d)=>a+d.rate,0)/wr.length : 0;

  const tel = document.getElementById('dTotal');
  tel.textContent = fmtB(td);
  if(flash){ tel.classList.remove('flash'); void tel.offsetWidth; tel.classList.add('flash'); }

  document.getElementById('dCount').textContent   = S.debts.filter(d=>d.debt>0).length;
  document.getElementById('dAvgRate').textContent = (avg*100).toFixed(2)+'%';
  document.getElementById('dPaid').textContent    = fmtB(S.totalPaid||0);
  document.getElementById('dYear') .textContent  = fmtB(iy,2);
  document.getElementById('dMonth').textContent  = fmtB(im,2);
  document.getElementById('dDay')  .textContent  = fmtB(id2,2);
  document.getElementById('dHour') .textContent  = fmtB(ih,4);
  document.getElementById('dPerSec').textContent = '฿'+is_.toFixed(6);

  document.getElementById('dBreakdown').innerHTML =
    [...S.debts].filter(d=>d.debt>0).sort((a,b)=>b.debt*(b.rate||0)-a.debt*(a.rate||0)).map(d=>{
      const dm=d.debt*(d.rate||0)/12;
      return`<div class="row">
        <div>
          <div style="font-size:.86rem;font-weight:500">${d.name}</div>
          <div style="font-size:.63rem;color:var(--sub);margin-top:2px">${d.rate?(d.rate*100).toFixed(2)+'%/yr':'no interest'}</div>
        </div>
        <div style="text-align:right">
          <div class="mono" style="font-size:.86rem">${fmtB(d.debt)}</div>
          ${d.rate?`<div style="font-size:.62rem;color:var(--red);margin-top:2px">${fmtB(dm,2)}/mo</div>`:''}
        </div>
      </div>`;
    }).join('');

  cancelAnimationFrame(_raf);
  _t0 = Date.now();
  (function tick(){
    const el=document.getElementById('dTicker');
    if(el) el.textContent='฿'+(((Date.now()-_t0)/1000)*is_).toFixed(4);
    _raf=requestAnimationFrame(tick);
  })();
}

// LIST
function renderList(){
  document.getElementById('debtList').innerHTML =
    [...S.debts].sort((a,b)=>b.debt-a.debt).map(d=>`
    <div class="debt-item" onclick="openSheet(${d.id})">
      <div class="d-dot" style="background:${dotCol(d.rate)}"></div>
      <div class="d-main">
        <div class="d-name">${d.name}</div>
        <div class="d-sub">${[d.rate?(d.rate*100).toFixed(2)+'%/yr':null,d.due?`due ${d.due}th`:null].filter(Boolean).join(' · ')||'—'}</div>
      </div>
      <div class="d-right">
        <div class="d-amount mono" style="color:${d.debt>0?'var(--text)':'var(--dim)'}">${fmtB(d.debt)}</div>
        ${d.rate?`<div class="d-int">${fmtB(d.debt*d.rate/12,0)}/mo</div>`:''}
      </div>
    </div>`).join('');
  document.getElementById('listTotal').textContent = fmtB(totDebt());
}

// SHEET
function openSheet(id){
  const isNew = id===null;
  const d = isNew
    ? {id:S.nextId,name:'',rate:'',cutoff:'',due:'',full:'',debt:'',note:''}
    : {...S.debts.find(x=>x.id===id)};

  document.getElementById('sheet').innerHTML=`
    <div class="sh-handle"></div>
    <div class="sh-title">${isNew?'New debt':'Edit — '+d.name}</div>

    <div class="field"><label>Name</label>
      <input id="fn" value="${d.name}" placeholder="Lender name"></div>
    <div class="f2">
      <div class="field"><label>Balance (฿)</label>
        <input id="fd" type="number" value="${d.debt||''}" placeholder="0"></div>
      <div class="field"><label>Interest / yr</label>
        <input id="fr" type="number" step=".001" value="${d.rate||''}" placeholder="0.33"></div>
    </div>
    <div class="f2">
      <div class="field"><label>Limit (฿)</label>
        <input id="ff" type="number" value="${d.full||''}" placeholder="optional"></div>
      <div class="field"><label>Due date (day)</label>
        <input id="fdu" value="${d.due||''}" placeholder="5"></div>
    </div>

    <hr class="divider">
    <div style="font-size:.6rem;color:var(--sub);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">Quick pay</div>
    <div class="pay-row">
      <input class="pay-input" type="number" id="fpay" placeholder="Amount (฿)">
      <button class="pay-btn" onclick="quickPay(${d.id})">Pay ✓</button>
    </div>

    <div class="sh-actions">
      ${!isNew?`<button class="btn-d" onclick="delDebt(${d.id})">Delete</button>`:''}
      <button class="btn-g" onclick="closeSheet()">Cancel</button>
      <button class="btn-p" onclick="saveDebt(${d.id},${isNew})">Save</button>
    </div>`;

  document.getElementById('overlay').classList.add('on');
}

function closeSheet(){ document.getElementById('overlay').classList.remove('on'); }
document.getElementById('overlay').addEventListener('click',e=>{
  if(e.target===e.currentTarget) closeSheet();
});

function saveDebt(id,isNew){
  const name=document.getElementById('fn').value.trim();
  if(!name){ toast('Name required'); return; }
  const obj={id,name,
    rate:  parseFloat(document.getElementById('fr').value)||0,
    debt:  parseFloat(document.getElementById('fd').value)||0,
    full:  parseFloat(document.getElementById('ff').value)||0,
    due:   document.getElementById('fdu').value.trim(),
    cutoff:'',note:'',
  };
  if(isNew){ S.debts.push(obj); S.nextId++; }
  else { S.debts=S.debts.map(d=>d.id===id?{...d,...obj}:d); }
  save(); closeSheet(); renderDash(true); if(cur===1) renderList();
  toast(isNew?'Added':'Saved');
}

function delDebt(id){
  if(!confirm('Delete this debt?')) return;
  S.debts=S.debts.filter(d=>d.id!==id);
  save(); closeSheet(); renderDash(true); if(cur===1) renderList();
  toast('Deleted');
}

function quickPay(id){
  const amt=parseFloat(document.getElementById('fpay').value);
  if(!amt||amt<=0){ toast('Enter amount'); return; }
  S.debts=S.debts.map(d=>d.id!==id?d:{...d,debt:Math.max(0,d.debt-amt)});
  S.totalPaid=(S.totalPaid||0)+amt;
  save(); closeSheet(); renderDash(true); if(cur===1) renderList();
  toast(`Paid ${fmtB(amt)} ✓`);
}

let _tt;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('on'),2000);
}

document.getElementById('topDate').textContent =
  new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
renderDash(false);

window.addEventListener('storage',e=>{
  if(e.key===SK){ S=load(); renderDash(true); if(cur===1)renderList(); }
});
</script>
</body>
</html>
